<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Yelp Rating Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #111;
      max-width: 480px;
      margin: 32px auto;
      padding: 0 16px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    .category {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .category:last-child {
      border-bottom: none;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    input[type="number"], select {
      width: 70px;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }

    button {
      background: #eee;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    button:hover {
      background: #ddd;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .weight-total {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .weight-ok {
      color: #2e7d32;
    }

    .weight-warn {
      color: #b26a00;
    }

    .divider {
      height: 1px;
      background: #eee;
      margin: 16px 0;
    }

    .result {
      text-align: center;
      margin-top: 12px;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .stars {
      font-size: 1.5rem;
      margin-top: 4px;
    }

    .footer {
      text-align: center;
      margin-top: 14px;
      font-size: 0.75rem;
      color: #888;
    }
  </style>
</head>
<body>

<h1>Yelp Rating Calculator</h1>
<div class="subtitle">Editable, value-first scoring</div>

<div class="card">

  <div id="categories"></div>

  <div class="controls">
    <button onclick="addCategory()">+ Add Category</button>
    <div id="weightTotal" class="weight-total"></div>
  </div>

  <div class="divider"></div>

  <div class="row">
    <span style="flex:1;">Would I come back?</span>
    <select id="return">
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>
  </div>

  <div class="result" id="result">
    Final Score: —
    <div class="stars"></div>
  </div>
</div>

<div class="footer">
  Weights auto-normalize • Half-star rounding
</div>

<script>
  let categories = [
    { name: "Value", weight: 40, score: "" },
    { name: "Wait & Transparency", weight: 25, score: "" },
    { name: "Product Quality", weight: 25, score: "" },
    { name: "Experience", weight: 10, score: "" }
  ];

  function render() {
    const container = document.getElementById("categories");
    container.innerHTML = "";

    categories.forEach((cat, index) => {
      const div = document.createElement("div");
      div.className = "category";

      div.innerHTML = `
        <div class="row">
          <input type="text" value="${cat.name}"
            onchange="updateName(${index}, this.value)" />

          <input type="number" min="0" value="${cat.weight}"
            onchange="updateWeight(${index}, this.value)" />

          <select onchange="updateScore(${index}, this.value)">
            <option value="">—</option>
            ${[1,2,3,4,5].map(n =>
              `<option value="${n}" ${cat.score == n ? "selected" : ""}>${n}</option>`
            ).join("")}
          </select>

          <button onclick="removeCategory(${index})">✕</button>
        </div>
      `;
      container.appendChild(div);
    });

    updateWeightTotal();
    calculate();
  }

  function updateName(i, val) { categories[i].name = val; }
  function updateWeight(i, val) { categories[i].weight = +val || 0; render(); }
  function updateScore(i, val) { categories[i].score = val; calculate(); }

  function addCategory() {
    categories.push({ name: "New Category", weight: 10, score: "" });
    render();
  }

  function removeCategory(i) {
    categories.splice(i, 1);
    render();
  }

  function updateWeightTotal() {
    const total = categories.reduce((s,c) => s + c.weight, 0);
    const el = document.getElementById("weightTotal");

    el.textContent = `Total weight: ${total}%`;
    el.className = "weight-total " + (total === 100 ? "weight-ok" : "weight-warn");
  }

  function calculate() {
    const filled = categories.filter(c => c.score).length;
    if (!filled) return;

    const totalWeight = categories.reduce((s,c) => s + c.weight, 0) || 1;

    let score = 0;
    categories.forEach(c => {
      if (c.score) {
        score += c.score * (c.weight / totalWeight);
      }
    });

    let stars = Math.round(score * 2) / 2;

    if (document.getElementById("return").value === "no" && stars > 3) {
      stars = 3;
    }

    document.getElementById("result").innerHTML = `
      Final Score: ${stars}
      <div class="stars">${"⭐".repeat(Math.floor(stars))}${stars % 1 ? "½" : ""}</div>
    `;
  }

  render();
</script>

</body>
</html>
