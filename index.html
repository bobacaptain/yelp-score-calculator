<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Yelp Score Calculator</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 400px;
      margin: 40px auto;
      line-height: 1.6;
    }
    label {
      display: block;
      margin-top: 12px;
    }
    select {
      width: 100%;
      padding: 6px;
      font-size: 16px;
    }
    .result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>Yelp Rating Calculator</h2>

<label>Value (40%)
  <select id="value">
    <option value="1">1</option><option value="2">2</option>
    <option value="3">3</option><option value="4">4</option>
    <option value="5">5</option>
  </select>
</label>

<label>Wait Time & Transparency (25%)
  <select id="wait">
    <option value="1">1</option><option value="2">2</option>
    <option value="3">3</option><option value="4">4</option>
    <option value="5">5</option>
  </select>
</label>

<label>Product Quality (25%)
  <select id="quality">
    <option value="1">1</option><option value="2">2</option>
    <option value="3">3</option><option value="4">4</option>
    <option value="5">5</option>
  </select>
</label>

<label>Experience (10%)
  <select id="experience">
    <option value="1">1</option><option value="2">2</option>
    <option value="3">3</option><option value="4">4</option>
    <option value="5">5</option>
  </select>
</label>

<label>Would I come back?
  <select id="return">
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>
</label>

<div class="result" id="result">Final Score: —</div>

<script>
  const inputs = document.querySelectorAll("select");

  inputs.forEach(input => input.addEventListener("change", calculate));

  function calculate() {
    const value = +document.getElementById("value").value;
    const wait = +document.getElementById("wait").value;
    const quality = +document.getElementById("quality").value;
    const experience = +document.getElementById("experience").value;
    const comeback = document.getElementById("return").value;

    let score =
      value * 0.4 +
      wait * 0.25 +
      quality * 0.25 +
      experience * 0.1;

    let stars = Math.round(score * 2) / 2;

    if (comeback === "no" && stars > 3) stars = 3;

    document.getElementById("result").textContent =
      `Final Score: ${stars} ⭐`;
  }
</script>

</body>
</html>
