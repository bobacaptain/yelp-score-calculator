<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Yelp Score Calculator</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 400px;
      margin: 40px auto;
      line-height: 1.6;
    }
    label {
      display: block;
      margin-top: 12px;
    }
    select {
      width: 100%;
      padding: 6px;
      font-size: 16px;
    }
    .result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="categories"></div>

<label>Would I come back?
  <select id="return">
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>
</label>

<div class="result" id="result"></div>

<script>
const categories = [
  { id: "value", label: "Value", weight: 40 },
  { id: "wait", label: "Wait & Transparency", weight: 25 },
  { id: "quality", label: "Product Quality", weight: 25 },
  { id: "experience", label: "Experience", weight: 10 }
];

const container = document.getElementById("categories");

categories.forEach(cat => {
  container.innerHTML += `
    <label>${cat.label} (${cat.weight}%)
      <select id="${cat.id}">
        ${[1,2,3,4,5].map(n => `<option>${n}</option>`).join("")}
      </select>
    </label>
  `;
});

document.querySelectorAll("select").forEach(el =>
  el.addEventListener("change", calculate)
);

function calculate() {
  const totalWeight = categories.reduce((sum, c) => sum + c.weight, 0);
  if (totalWeight > 100) {
    document.getElementById("result").textContent =
      "⚠️ Weights exceed 100%";
    return;
  }

  let score = 0;
  categories.forEach(cat => {
    const val = +document.getElementById(cat.id).value;
    score += val * (cat.weight / 100);
  });

  let stars = Math.round(score * 2) / 2;

  if (document.getElementById("return").value === "no" && stars > 3) {
    stars = 3;
  }

  document.getElementById("result").textContent =
    `Final Score: ${stars} ⭐`;
}
</script>


</body>
</html>
